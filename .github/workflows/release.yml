name: Release

# 打 v* 标签（如 v1.0.0）时构建插件包、发布 GitHub Release 并（幂等地）发布 npm。
# npm 发布走 OIDC Trusted Publishing（无静态 token / 无 OTP，Node 24 自带 npm 11）。
# 需先在 npmjs.com 包设置里配置 trusted publisher：
#   repo = MoonlitDropOfBlood/dsh-git-manager，workflow = .github/workflows/release.yml
# 已存在于 npm 的版本会跳过 publish（首版可先用本机 token 发布 bootstrap，
# 之后的 v* 标签全自动）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Check, test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check + Test
        run: npm run check && npm test

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - name: Skip when this version is already on npm
        id: check
        run: |
          PKG=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$PKG" version --registry=https://registry.npmjs.org 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.exists == 'false'
        run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            dsh-git-manager — DeepSeek Harness Git 工作区管理插件。

            ### 功能
            - 入口在输入框「模式」选择器旁（仅当前目录是 git 仓库时显示），面板与「设置」同规格（Esc / 遮罩点击关闭）。
            - 变更：staged / unstaged / untracked 分组，stage / discard，自绘 unified diff，commit（含 amend）。
            - 分支：新建 / 切换 / 改名 / 删除 / 合并，与当前分支对比 diff。
            - 历史：分支线图形（Host 侧布局 + Client SVG）+ refs 徽章 + commit diff。
            - 冲突：ours / theirs / 手动编辑（三栏对照）；继续 / 中止合并。
            - Worktree：添加（成功后自动注册为 DSH 工作区）/ 删除 / prune。

            ### 📦 安装
            ```bash
            dsh plugin --profile web add @duke-dsh-plugins/dsh-git-manager
            ```
            或使用本 Release 附件中的 tgz 包安装。装完**必须重启 DSH** 生效。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
